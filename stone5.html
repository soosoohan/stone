<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>넘스톤 5×5 (Numstone) | 수수랜드</title>
<meta name="description" content="넘스톤 5×5 확장 모드 — 바위 장애물을 피해 숫자를 합체시키는 퍼즐 게임">
<link rel="canonical" href="https://soosooland.com/numstone/numstone5.html">
<meta property="og:title" content="넘스톤 5×5 | 수수랜드">
<meta property="og:description" content="바위를 깨워라 — 숫자 합체 퍼즐 확장 모드">
<meta property="og:url" content="https://soosooland.com/numstone/numstone5.html">
<meta property="og:image" content="https://soosooland.com/numstone/og-image.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 6px;
    letter-spacing: 2px;
    color: #f0c040;
  }

  .version-badge {
    background: #9b59b6;
    color: #fff;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  #score-area {
    margin-bottom: 14px;
    font-size: 1.1rem;
    color: #ccc;
  }

  #score-area span {
    color: #f0c040;
    font-weight: bold;
    font-size: 1.3rem;
  }

  #queue-area {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: flex-end;
  }

  .queue-label {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 4px;
    text-align: center;
  }

  .queue-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .queue-card {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: bold;
    background: #444;
    color: #888;
    transition: all 0.3s;
  }

  .queue-card.active {
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(240,192,64,0.6);
  }

  #col-buttons {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
  }

  .col-btn {
    width: 62px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: #2a2a4a;
    color: #aaa;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .col-btn.selected {
    background: #f0c040;
    color: #1a1a2e;
    font-weight: bold;
  }

  .col-btn:hover { background: #3a3a6a; }

  #grid {
    display: grid;
    grid-template-columns: repeat(5, 62px);
    grid-template-rows: repeat(5, 62px);
    gap: 4px;
    background: #111;
    padding: 6px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .cell {
    width: 62px;
    height: 62px;
    border-radius: 8px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: bold;
    transition: background 0.15s;
  }

  #drop-btn {
    margin-top: 14px;
    padding: 12px 40px;
    border-radius: 10px;
    border: none;
    background: #f0c040;
    color: #1a1a2e;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    display: none;
  }

  #pc-hint {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #666;
    text-align: center;
    line-height: 1.6;
  }

  /* 시작 화면 */
  #start-screen {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 200;
  }

  #start-screen h1 { font-size: 2.8rem; margin-bottom: 0; }
  #start-screen .subtitle { color: #888; font-size: 0.95rem; }

  .difficulty-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 240px;
  }

  .diff-btn {
    padding: 14px 20px;
    border-radius: 12px;
    border: 2px solid transparent;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
  }

  .diff-btn .diff-label { flex: 1; text-align: left; }
  .diff-btn .diff-cards { font-size: 0.8rem; opacity: 0.8; }

  .diff-btn.easy   { background: #1a3a1a; border-color: #56ab2f; color: #a8e063; }
  .diff-btn.easy:hover { background: #2a5a2a; }
  .diff-btn.normal { background: #3a2a1a; border-color: #f39c12; color: #f0c040; }
  .diff-btn.normal:hover { background: #5a3a1a; }
  .diff-btn.hard   { background: #3a1a1a; border-color: #e74c3c; color: #ff8888; }
  .diff-btn.hard:hover { background: #5a1a1a; }

  /* 게임오버 */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 100;
  }

  #overlay.show { display: flex; }
  #overlay h2 { font-size: 2.5rem; color: #f0c040; }
  #overlay p  { font-size: 1.2rem; color: #ccc; }

  .diff-badge { font-size: 0.85rem; color: #888; margin-top: -10px; }

  #restart-btn {
    padding: 12px 36px;
    border-radius: 10px;
    border: none;
    background: #f0c040;
    color: #1a1a2e;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }

  #change-diff-btn {
    padding: 8px 24px;
    border-radius: 10px;
    border: 1px solid #444;
    background: transparent;
    color: #aaa;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #back-link {
    color: #555;
    font-size: 0.8rem;
    text-decoration: none;
    margin-top: 8px;
  }
  #back-link:hover { color: #888; }

  @keyframes merge-pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .merge-anim { animation: merge-pop 0.2s ease; }

  @keyframes reveal-anim {
    0%   { transform: scale(1.3); filter: brightness(2); }
    100% { transform: scale(1);   filter: brightness(1); }
  }
  .reveal-anim { animation: reveal-anim 0.35s ease; }
</style>
</head>
<body>

<!-- 시작 화면 -->
<div id="start-screen">
  <h1>🪨 넘스톤</h1>
  <p class="subtitle">숫자 합체 퍼즐 5×5</p>
  <div class="difficulty-buttons">
    <button class="diff-btn easy"   onclick="startGame('easy')">
      <span>🟢</span><span class="diff-label">쉬움</span><span class="diff-cards">2, 4</span>
    </button>
    <button class="diff-btn normal" onclick="startGame('normal')">
      <span>🟡</span><span class="diff-label">보통</span><span class="diff-cards">2, 4, 8</span>
    </button>
    <button class="diff-btn hard"   onclick="startGame('hard')">
      <span>🔴</span><span class="diff-label">어려움</span><span class="diff-cards">2, 4, 8, 16</span>
    </button>
  </div>
  <a href="index.html" id="back-link">← 넘스톤 홈</a>
</div>

<!-- 게임 화면 -->
<h1>🪨 넘스톤</h1>
<div class="version-badge">5×5 확장 모드</div>
<div id="score-area">점수: <span id="score">0</span></div>

<div id="queue-area">
  <div class="queue-slot">
    <div class="queue-label">다음</div>
    <div class="queue-card active" id="q0"></div>
  </div>
  <div class="queue-slot">
    <div class="queue-label"></div>
    <div class="queue-card" id="q1"></div>
  </div>
  <div class="queue-slot">
    <div class="queue-label"></div>
    <div class="queue-card" id="q2"></div>
  </div>
</div>

<div id="col-buttons"></div>
<div id="grid"></div>
<button id="drop-btn">▼ 낙하</button>

<div id="pc-hint">
  ← → 방향키로 열 선택 &nbsp;|&nbsp; Enter로 낙하<br>
  모바일: 열 버튼 탭 후 낙하 버튼
</div>

<div id="overlay">
  <h2>🪨 게임 오버</h2>
  <p>최종 점수: <strong id="final-score"></strong></p>
  <p class="diff-badge" id="diff-result"></p>
  <button id="restart-btn">같은 난이도로 다시</button>
  <button id="change-diff-btn">난이도 바꾸기</button>
</div>

<script>
const ROWS = 5, COLS = 5;
const ROCK_VALUES = [64, 128, 256];
const NUM_ROCKS = 3;
const QUEUE_SIZE = 3;

const DIFFICULTY_CARDS = {
  easy:   [2, 4],
  normal: [2, 4, 8],
  hard:   [2, 4, 8, 16],
};

const DIFFICULTY_LABEL = {
  easy:   '🟢 쉬움',
  normal: '🟡 보통',
  hard:   '🔴 어려움',
};

const COLOR_MAP = {
  2:    { bg: '#a8e063', fg: '#2a5a00' },
  4:    { bg: '#56ab2f', fg: '#fff' },
  8:    { bg: '#0abdc6', fg: '#fff' },
  16:   { bg: '#007ec6', fg: '#fff' },
  32:   { bg: '#9b59b6', fg: '#fff' },
  64:   { bg: '#e91e8c', fg: '#fff' },
  128:  { bg: '#f39c12', fg: '#fff' },
  256:  { bg: '#e74c3c', fg: '#fff' },
  512:  { bg: '#c0392b', fg: '#fff' },
  1024: { bg: '#bdc3c7', fg: '#2c3e50' },
  2048: { bg: '#f0f0f0', fg: '#e67e22' },
};

function getColor(val) {
  return COLOR_MAP[val] || { bg: '#f0c040', fg: '#1a1a2e' };
}

let board, queue, selectedCol, score, gameOver, isMobile, currentDifficulty;

function startGame(difficulty) {
  currentDifficulty = difficulty;
  document.getElementById('start-screen').style.display = 'none';
  init();
}

function init() {
  score = 0;
  gameOver = false;
  selectedCol = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('overlay').classList.remove('show');

  board = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => ({ value: 0, isRock: false, hidden: false }))
  );

  const rockCols = shuffleArray([0,1,2,3,4]).slice(0, NUM_ROCKS);
  rockCols.forEach(c => {
    const r = 1 + Math.floor(Math.random() * (ROWS - 1));
    const rv = ROCK_VALUES[Math.floor(Math.random() * ROCK_VALUES.length)];
    board[r][c] = { value: rv, isRock: true, hidden: true };
  });

  queue = Array.from({ length: QUEUE_SIZE + 10 }, randomCard);

  isMobile = window.innerWidth <= 640 || 'ontouchstart' in window;
  document.getElementById('drop-btn').style.display = isMobile ? 'block' : 'none';
  document.getElementById('pc-hint').style.display  = isMobile ? 'none'  : 'block';

  buildGrid();
  buildColButtons();
  updateQueueUI();
  renderBoard();
  highlightCol();
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomCard() {
  const cards = DIFFICULTY_CARDS[currentDifficulty];
  const weights = [50, 35, 15, 10];
  const total = weights.slice(0, cards.length).reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < cards.length; i++) {
    r -= weights[i];
    if (r <= 0) return cards[i];
  }
  return cards[0];
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      grid.appendChild(cell);
    }
  }
}

function buildColButtons() {
  const container = document.getElementById('col-buttons');
  container.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const btn = document.createElement('button');
    btn.className = 'col-btn' + (c === selectedCol ? ' selected' : '');
    btn.textContent = `${c + 1}열`;
    btn.addEventListener('click', () => {
      selectedCol = c;
      highlightCol();
      if (isMobile) return;
      dropCard();
    });
    container.appendChild(btn);
  }
}

function highlightCol() {
  document.querySelectorAll('.col-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === selectedCol);
  });
}

function renderBoard(mergeSet, revealSet) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.getElementById(`cell-${r}-${c}`);
      const d = board[r][c];

      el.classList.remove('merge-anim', 'reveal-anim');
      void el.offsetWidth;

      if (mergeSet && mergeSet.has(`${r}-${c}`)) el.classList.add('merge-anim');
      if (revealSet && revealSet.has(`${r}-${c}`)) el.classList.add('reveal-anim');

      if (d.isRock && d.hidden) {
        el.style.background = '#2d2d2d';
        el.style.color = '#555';
        el.style.border = '3px solid #444';
        el.textContent = '🪨';
        el.style.fontSize = '1.6rem';
      } else if (d.isRock && !d.hidden) {
        const col = getColor(d.value);
        el.style.background = col.bg;
        el.style.color = col.fg;
        el.style.border = '3px dashed #fff8';
        el.textContent = d.value;
        el.style.fontSize = fontSize(d.value);
      } else if (d.value > 0) {
        const col = getColor(d.value);
        el.style.background = col.bg;
        el.style.color = col.fg;
        el.style.border = 'none';
        el.textContent = d.value;
        el.style.fontSize = fontSize(d.value);
      } else {
        el.style.background = '#222';
        el.style.color = '#555';
        el.style.border = 'none';
        el.textContent = '';
        el.style.fontSize = '1.2rem';
      }
    }
  }
}

function fontSize(v) {
  if (v >= 1000) return '0.9rem';
  if (v >= 100)  return '1rem';
  return '1.2rem';
}

function updateQueueUI() {
  for (let i = 0; i < QUEUE_SIZE; i++) {
    const el = document.getElementById(`q${i}`);
    if (!el) continue;
    const val = queue[i];
    el.textContent = val ?? '';
    el.style.background = i === 0 ? '#555' : '#333';
    el.style.color      = i === 0 ? '#eee' : '#777';
    el.className = 'queue-card' + (i === 0 ? ' active' : '');
  }
}

function dropCard() {
  if (gameOver) return;

  const col = selectedCol;
  const cardVal = queue[0];

  let targetRow = -1;
  for (let r = 0; r < ROWS; r++) {
    const cell = board[r][col];
    if (cell.isRock || cell.value > 0) {
      if (r > 0 && board[r-1][col].value === 0 && !board[r-1][col].isRock) {
        targetRow = r - 1;
      }
      break;
    }
    if (r === ROWS - 1) targetRow = r;
  }

  if (targetRow === -1) {
    checkGameOver();
    return;
  }

  board[targetRow][col] = { value: cardVal, isRock: false, hidden: false };
  queue.shift();
  queue.push(randomCard());
  updateQueueUI();

  const mergeSet  = new Set();
  const revealSet = new Set();
  runMergeLoop(targetRow, col, mergeSet, revealSet);

  renderBoard(mergeSet, revealSet);
  checkGameOver();
}

function runMergeLoop(newR, newC, mergeSet, revealSet) {
  let q = [{ r: newR, c: newC }];

  while (q.length > 0) {
    const next = [];
    for (const { r, c } of q) {
      if (board[r][c].value === 0) continue;
      const val = board[r][c].value;
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        const nb = board[nr][nc];

        if (nb.isRock) {
          if (nb.hidden && nb.value === val * 2) {
            board[nr][nc].hidden = false;
            revealSet.add(`${nr}-${nc}`);
          } else if (!nb.hidden && nb.value === val) {
            score += val * 2;
            document.getElementById('score').textContent = score;
            board[nr][nc] = { value: val * 2, isRock: false, hidden: false };
            board[r][c]   = { value: 0, isRock: false, hidden: false };
            mergeSet.add(`${nr}-${nc}`);
            next.push({ r: nr, c: nc });
          }
          continue;
        }

        if (nb.value === val) {
          score += val * 2;
          document.getElementById('score').textContent = score;
          board[nr][nc] = { value: val * 2, isRock: false, hidden: false };
          board[r][c]   = { value: 0, isRock: false, hidden: false };
          mergeSet.add(`${nr}-${nc}`);
          next.push({ r: nr, c: nc });
          break;
        }
      }
    }
    q = next;
  }

  applyGravityAll();
}

function applyGravityAll() {
  for (let c = 0; c < COLS; c++) {
    getColumnSegments(c).forEach(seg => compactDown(c, seg));
  }
}

function getColumnSegments(c) {
  const segments = [];
  let start = 0;
  for (let r = 0; r < ROWS; r++) {
    if (board[r][c].isRock) {
      if (r > start) segments.push({ from: start, to: r - 1 });
      start = r + 1;
    }
  }
  if (start < ROWS) segments.push({ from: start, to: ROWS - 1 });
  return segments;
}

function compactDown(c, { from, to }) {
  let writeRow = to;
  for (let r = to; r >= from; r--) {
    if (board[r][c].value > 0 && !board[r][c].isRock) {
      if (r !== writeRow) {
        board[writeRow][c] = { ...board[r][c] };
        board[r][c] = { value: 0, isRock: false, hidden: false };
      }
      writeRow--;
    }
  }
  for (let r = writeRow; r >= from; r--) {
    board[r][c] = { value: 0, isRock: false, hidden: false };
  }
}

function checkGameOver() {
  for (let c = 0; c < COLS; c++) {
    const cell = board[0][c];
    if (!cell.isRock && cell.value === 0) return;
  }
  gameOver = true;
  document.getElementById('final-score').textContent = score;
  document.getElementById('diff-result').textContent = DIFFICULTY_LABEL[currentDifficulty];
  document.getElementById('overlay').classList.add('show');
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); selectedCol = Math.max(0, selectedCol - 1); highlightCol(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); selectedCol = Math.min(COLS - 1, selectedCol + 1); highlightCol(); }
  if (e.key === 'Enter')      { dropCard(); }
});

document.getElementById('drop-btn').addEventListener('click', dropCard);
document.getElementById('restart-btn').addEventListener('click', init);
document.getElementById('change-diff-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('start-screen').style.display = 'flex';
});
</script>
</body>
</html>
